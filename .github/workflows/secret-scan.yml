name: Secret scan

# Non-bypassable backstop for the local pre-commit hook: a developer can skip the
# hook with `git commit --no-verify`, but every push and PR is scanned here too.
# Self-contained (pure bash + git, no third-party action or token) to match the
# hermetic, least-privilege posture of ci.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan for secrets & PII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan all tracked files
        run: bash scripts/secret-scan.sh --all

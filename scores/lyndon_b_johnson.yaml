            source_type: primary_document
            tier: 1
            claim: "Cabinet-level HUD established under LBJ (Sept 9, 1965); Robert Weaver sworn in Jan 18, 1966 as first Secretary and first Cabinet-level African American."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28

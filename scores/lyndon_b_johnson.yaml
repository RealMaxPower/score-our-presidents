            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Law numbers (EOA=PL 88-452, Food Stamp Act=PL 88-525) and the War-on-Poverty framework role are accurate, and the official poverty rate did fall from ~19% (1963-64) to ~12.1% by 1969, matching the ~19%→~12% in five years claim."
              suggested_fix: "https://aspe.hhs.gov/sites/default/files/private/pdf/154286/50YearTrends.pdf"
      - id: "5.4"
        name: "Housing & cost of living"
        good_score: 7
        harm_score: 1
        notes: "Department of Housing and Urban Development created 1965. Robert Weaver as first HUD Secretary (first African American Cabinet member). Demonstration Cities and Metropolitan Development Act 1966."
        evidence:

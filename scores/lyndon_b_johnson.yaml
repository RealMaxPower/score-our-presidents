              suggested_fix: "For congress.gov deep links: https://www.congress.gov/bill/89th-congress/house-bill/2362 (ESEA) and https://www.congress.gov/bill/89th-congress/house-bill/9567 (HEA)."
      - id: "5.3"
        name: "Safety net"
        good_score: 9
        harm_score: 0
        notes: "Food Stamp Act of 1964 made program permanent (was Kennedy pilot). Economic Opportunity Act 1964 (Job Corps, VISTA, Head Start, Community Action). Major welfare state expansion."

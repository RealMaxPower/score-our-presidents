president: lyndon_b_johnson
display_name: "Lyndon B. Johnson"
term_start: 1963-11-22
term_end: 1969-01-20
party: D
terms_served: 1_full_plus_partial
calibration_anchor: false
spec_version: v1.2
note: "Spec v1.0 §8 used LBJ as the worked example for the framework. This scoring reflects v1.2 structure (13 categories, 56 sub-criteria) and applies §4.6 multi-attribution and v1.2 §9.4 living-president rules."

categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Strong economy with rising inflation late-term. Revenue Act of 1964 tax cuts. War on Poverty expansion. Guns-and-butter fiscal pattern."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 8
        harm_score: 2
        notes: "Unemployment fell from 5.5% (Nov 1963) to 3.4% (Jan 1969). Real GDP grew ~5%/year average. Era of peak postwar prosperity."
        evidence:
          - citation: "BLS unemployment series 1963-1969; BEA real GDP data"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Unemployment fell to 3.4% by end of term — lowest since 1953 — alongside ~5%/year real GDP growth."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Softened the overstated superlative from \"lowest of postwar era to that point\" to \"lowest since 1953,\" since 1953's ~2.9% was lower."
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 8
        harm_score: 1
        notes: "War on Poverty programs cut poverty rate from 19% (1964) to 12% (1969). Continued Great Compression."
        evidence:
          - citation: "Census Bureau poverty data 1963-1969"
            source_url: "https://www.census.gov/"
            source_type: statistic
            tier: 1
            claim: "Federal poverty rate fell from ~19% to ~12% across LBJ term, largest single-administration poverty reduction in US history."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Census data confirms the official poverty rate fell from 19.5% (1963) to 12.1% (1969) across LBJ's term—the steepest decline in the official series (begun 1959)—though the exact \"largest single-administration in US history\" superlative isn't explicitly stated in a single source and pre-1959 data is unavailable for comparison."
              suggested_fix: "Deep link to year-by-year data: https://www.census.gov/data/tables/time-series/demo/income-poverty/historical-poverty-people.html (Table 2)"
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 3
        harm_score: 6
        notes: "Guns-and-butter fiscal expansion. Vietnam War + Great Society without commensurate revenue. Surcharge enacted 1968 belatedly. Debt-to-GDP rose modestly but inflation pressure built."
        evidence:
          - citation: "OMB Historical Tables; Revenue and Expenditure Control Act of 1968, Public Law 90-364"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: statistic
            tier: 1
            claim: "Federal deficit grew from $5.9B (1964) to $25.2B (1968); 1968 surcharge tax came too late to prevent late-1960s inflation buildup."
            direction: harm
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "OMB/American Presidency Project budget data confirm FY1964 deficit of $5.9B and FY1968 deficit of $25.2B (largest since WWII), and sources confirm the 1968 surcharge (PL 90-364) came too late to halt late-1960s inflation."
              suggested_fix: "https://www.presidency.ucsb.edu/statistics/data/federal-budget-receipts-and-outlays"
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 6
        harm_score: 2
        notes: "Strong union era continued. Minimum wage increased. Real wages rose strongly. Federal contracting affirmative action."
        evidence:
          - citation: "BLS real wages data 1963-1969; Fair Labor Standards Act amendments"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Real median wages grew strongly during LBJ term; minimum wage rose from $1.25 to $1.60/hour."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "DOL/Wikipedia confirm the standard federal minimum wage rose $1.25 (Sept 1963) to $1.40 (Feb 1967) to $1.60 (Feb 1968, the FLSA real-value peak, all within LBJ's term), and Census/EPI data show real median family income grew ~27% (1963-69), so both parts hold."
              suggested_fix: "For the minimum-wage figure use https://www.dol.gov/agencies/whd/minimum-wage/history/chart; note $1.60 in Feb 1968 applies to previously-covered workers (newly-covered workers reached $1.60 only in 1971)."

  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.3 high Cold War. Vietnam War escalation is era-defining harm anchor. Some diplomacy (NPT signed 1968, ABM Treaty negotiations began). Dominican Republic intervention (1965)."
    sub_criteria:
      - id: "2.1"
        name: "War & peace decisions"
        good_score: 1
        harm_score: 10
        era_context: "E2.3 Cold War — era-defining 10-harm anchor"
        notes: "Vietnam War escalation from ~16,000 advisors (Nov 1963) to ~537,000 troops (1968). Gulf of Tonkin Resolution (1964) obtained under misleading representations. Defining war-decision failure of 20th century US foreign policy."
        evidence:
          - citation: "Gulf of Tonkin Resolution, Public Law 88-408 (1964); NSA 'Gulf of Tonkin Mystery' (Hanyok); DoD troop-strength tables"
            source_url: "https://www.archives.gov/"
            source_type: primary_document
            tier: 1
            claim: "Gulf of Tonkin Resolution was obtained on incomplete and partially fabricated reports of attacks on US destroyers (NSA-declassified records confirm the August 4, 1964 'attack' never occurred); it led to escalation from ~16,000 to a peak of ~536,000 US troops in Vietnam (end of 1968)."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Corrected troop peak to ~536,000 (end 1968), not 537,000; added that NSA records confirm the Aug 4 1964 'attack' never occurred."
      - id: "2.2"
        name: "Alliance management"
        good_score: 5
        harm_score: 4
        notes: "NATO held but strained by Vietnam. Allied troop contributions sought (some achieved). Some bilateral damage with allies opposing Vietnam."
        evidence:
          - citation: "NATO records 1963-1969; Vietnam allied contributions"
            source_url: "https://www.nato.int/"
            source_type: historical_record
            tier: 2
            claim: "NATO held through Vietnam-era tensions; alliance relationships strained by US Vietnam priorities."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "NATO survived major Vietnam-era strain (France's 1966 withdrawal from integrated command, allied refusal of \"More Flags\" troop requests) while remaining intact, matching the claim; sourceUrl is a bare NATO homepage."
              suggested_fix: "Use a deep link such as https://history.state.gov/departmenthistory/short-history/lbj or https://millercenter.org/president/lbjohnson/foreign-affairs to document Vietnam-era alliance strain."
      - id: "2.3"
        name: "Diplomacy & soft power"
        good_score: 3
        harm_score: 7
        notes: "Nuclear Non-Proliferation Treaty signed (July 1968). Otherwise diplomacy overshadowed by Vietnam. US international standing collapsed during term."
        evidence:
          - citation: "Treaty on the Non-Proliferation of Nuclear Weapons (NPT), opened for signature July 1, 1968"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "NPT signed 1968 became foundational non-proliferation framework; one major diplomatic achievement in a term dominated by Vietnam."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "NPT opened for signature July 1, 1968 with Johnson endorsing it at the White House; it is the foundational non-proliferation framework, a major diplomatic achievement during a Vietnam-dominated term—all specifics confirmed."
              suggested_fix: "Deep link: https://history.state.gov/historicaldocuments/frus1964-68v11/d250"
      - id: "2.4"
        name: "Civilian impact"
        good_score: 1
        harm_score: 9
        era_context: "E2.3 — Vietnam civilian impact era-10-harm anchor"
        notes: "Estimated 2 million+ Vietnamese, Lao, Cambodian civilian deaths attributable to war and its expansion. US bombing campaigns (Rolling Thunder, etc.) heaviest in history to that point."
        evidence:
          - citation: "Vietnam War casualty estimates (Lewy 1978 civilian-only; Hirschman et al. 1995; Vietnamese-government and BMJ 2008 totals)"
            source_url: "canonical"
            source_type: academic
            tier: 1
            claim: "Estimates of Vietnam War deaths range from ~1.5-3 million TOTAL across Vietnam, Laos, and Cambodia; conservative civilian-only scholarship is lower (Lewy ~405,000-627,000; Hirschman et al. ~0.8-1.1 million Vietnamese deaths). The LBJ era saw the largest US escalation."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Reframed: the ~1.5-3M range is TOTAL deaths; Lewy's civilian-only estimate is ~405-627k and Hirschman ~0.8-1.1M. Largest-US-escalation point stands."
  - category: 3
    name: "Civil rights & equality"
    category_notes: "Era E3.2 Civil Rights Revolution — era-defining 10-good anchor across multiple sub-criteria. Civil Rights Act 1964, Voting Rights Act 1965, Fair Housing Act 1968."
    sub_criteria:
      - id: "3.1"
        name: "Racial equity"
        good_score: 10
        harm_score: 0
        era_context: "E3.2 — era-defining 10-good anchor"
        notes: "Civil Rights Act of 1964 (Public Law 88-352), Voting Rights Act of 1965 (Public Law 89-110), Fair Housing Act of 1968 (Title VIII Civil Rights Act of 1968). Most consequential civil rights legislation since Reconstruction."
        evidence:
          - citation: "Civil Rights Act of 1964 (Public Law 88-352); Voting Rights Act of 1965 (Public Law 89-110); Fair Housing Act 1968 (Public Law 90-284)"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "Three landmark federal civil rights laws ended Jim Crow legal apparatus and created modern federal anti-discrimination framework; Black voter registration in covered states roughly doubled within five years of VRA."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "CRA 1964 (PL 88-352), VRA 1965 (PL 89-110), and FHA 1968 (PL 90-284) are correctly cited and authoritative sources confirm they dismantled Jim Crow and built the federal anti-discrimination framework; Black registration in covered states roughly doubled (e.g., seven-state aggregate 29.3% in 1965 to ~56.6%, Alabama 23%->56.7% and Mississippi 6.7%->59.4% by 1968), so the \"doubled within five years\" claim holds."
              suggested_fix: "For the bare congress.gov homepage, use deep links: https://www.congress.gov/bill/88th-congress/house-bill/7152 (CRA 1964); the National Archives VRA page (https://www.archives.gov/milestone-documents/voting-rights-act) is a stronger source for the registration figures."
      - id: "3.2"
        name: "Gender equity"
        good_score: 5
        harm_score: 1
        notes: "Civil Rights Act 1964 Title VII included sex discrimination. EEOC enforcement weak initially. Executive Order 11375 (1967) extended affirmative action to women."
        evidence:
          - citation: "Civil Rights Act 1964 Title VII; Executive Order 11375 (1967)"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "Title VII of Civil Rights Act 1964 prohibited sex discrimination in employment; EO 11375 extended federal contracting affirmative action to women."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Both elements verified: Title VII of the 1964 Civil Rights Act prohibited sex discrimination in employment, and LBJ's EO 11375 (Oct 13, 1967) amended EO 11246 to add \"sex,\" extending federal-contractor affirmative action to women."
              suggested_fix: "For congress.gov homepage, a deeper source: https://www.eeoc.gov/statutes/title-vii-civil-rights-act-1964 and https://www.presidency.ucsb.edu/documents/executive-order-11375-amending-executive-order-no-11246-relating-equal-employment"
      - id: "3.3"
        name: "LGBTQ+ rights"
        good_score: 0
        harm_score: 2
        notes: "EO 10450 continued. Era-typical hostility. Stonewall (1969) just after LBJ term."
        evidence:
          - citation: "EO 10450 continuation 1963-1969"
            source_url: "canonical"
            source_type: primary_document
            tier: 2
            claim: "Federal anti-LGBTQ employment policy continued throughout LBJ term."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "EO 10450's ban on homosexuals in federal employment (issued 1953) remained in continuous force throughout LBJ's 1963-1969 term, unrescinded until 1975 CSC changes, so the policy did continue throughout his presidency as stated."
              suggested_fix: "https://en.wikipedia.org/wiki/Executive_Order_10450"
      - id: "3.4"
        name: "Disability & other protected classes"
        good_score: 4
        harm_score: 1
        notes: "Vocational Rehabilitation Amendments expanded. Architectural Barriers Act of 1968 (federal building accessibility)."
        evidence:
          - citation: "Architectural Barriers Act of 1968, Public Law 90-480"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "1968 Act required federally-funded buildings to be accessible; precursor to ADA accessibility standards."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "The Architectural Barriers Act of 1968 (Pub. L. 90-480), signed by LBJ on Aug 12, 1968, requires federally-funded/leased buildings to be accessible to people with disabilities and is widely recognized as the first federal accessibility law and precursor to the ADA."
              suggested_fix: "Replace bare homepage with deep link: https://www.access-board.gov/about/law/aba.html"
      - id: "3.5"
        name: "Tribal & indigenous policy"
        good_score: 6
        harm_score: 3
        notes: "Indian Civil Rights Act of 1968 extended Bill of Rights protections to tribal governments (controversial). Termination policy continued though slowing."
        evidence:
          - citation: "Indian Civil Rights Act, Title II of Civil Rights Act of 1968 (Public Law 90-284)"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "ICRA extended most Bill of Rights protections to tribal members vis-a-vis tribal governments — contested by some tribes as federal overreach but ended some tribal-government abuses."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "ICRA (Title II of Civil Rights Act of 1968, P.L. 90-284, signed by LBJ April 11, 1968) extended most—not all—Bill of Rights protections against tribal governments; it was contested by tribes (e.g., NM Pueblos) as federal overreach and was passed to curb tribal-official abuses, all per authoritative sources."
              suggested_fix: "Deep link: https://www.govinfo.gov/content/pkg/COMPS-343/pdf/COMPS-343.pdf (Civil Rights Act of 1968 compilation, P.L. 90-284)"

  - category: 4
    name: "Civil liberties & rule of law"
    category_notes: "Era E4.2 Cold War surveillance. FBI surveillance of MLK and civil rights movement under Hoover with LBJ awareness. War-time secrecy on Vietnam."
    sub_criteria:
      - id: "4.1"
        name: "Speech & press posture"
        good_score: 4
        harm_score: 6
        notes: "Increasing press hostility over Vietnam (credibility gap). FBI surveillance of journalists. Some First Amendment progress via SCOTUS (NYT v. Sullivan 1964)."
        evidence:
          - citation: "NYT v. Sullivan, 376 U.S. 254 (1964); LBJ press relations records"
            source_url: "canonical"
            source_type: primary_document
            tier: 1
            claim: "LBJ press relationship deteriorated sharply over Vietnam credibility gap; NYT v. Sullivan strengthened press protections via SCOTUS."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Both assertions verified: LBJ's press relations deteriorated over the Vietnam \"credibility gap\" (popularized 1966, peaking at 1968 Tet), and NYT v. Sullivan, 376 U.S. 254 (1964), was a unanimous SCOTUS ruling establishing the \"actual malice\" standard that strengthened press protections; citation is exact, though Sullivan arose from civil rights libel litigation, not from LBJ himself."
              suggested_fix: "https://supreme.justia.com/cases/federal/us/376/254/"
      - id: "4.2"
        name: "Search, seizure, and surveillance"
        good_score: 2
        harm_score: 7
        notes: "FBI COINTELPRO targeting MLK, civil rights, anti-war movements expanded. LBJ aware of MLK surveillance. NSA Operation Minaret monitoring anti-war activists."
        evidence:
          - citation: "Church Committee Report (1976) on COINTELPRO; FBI files on MLK surveillance"
            source_url: "https://www.senate.gov/"
            source_type: primary_document
            tier: 1
            claim: "COINTELPRO and Operation Minaret targeted civil rights and anti-war movements during LBJ term with administration awareness."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Authoritative sources confirm FBI COINTELPRO (Black Hate 1967, New Left 1968) and NSA Minaret (begun summer 1967, tasked by LBJ himself) targeted civil rights and anti-war figures during LBJ's term with direct presidential involvement; Church Committee documented both."
              suggested_fix: "https://www.senate.gov/about/powers-procedures/investigations/church-committee.htm"
      - id: "4.3"
        name: "Executive restraint"
        good_score: 2
        harm_score: 8
        notes: "Vietnam War prosecuted under Gulf of Tonkin Resolution rather than declaration. Mass escalation without congressional involvement. Per §4.6 Vietnam primarily at 2.1 but executive restraint secondary."
        evidence:
          - citation: "Gulf of Tonkin Resolution authority and Vietnam War prosecution"
            source_url: "https://www.archives.gov/"
            source_type: primary_document
            tier: 1
            claim: "LBJ used Gulf of Tonkin Resolution authority to escalate Vietnam without further congressional authorization - an ~23-fold troop increase (from ~23,000 at the August 1964 resolution to ~536,000 by the end of 1968)."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Corrected '32-fold' to ~23-fold (from ~23,000 troops at the Aug 1964 resolution to ~536,000 by end 1968)."
      - id: "4.4"
        name: "Transparency & FOIA"
        good_score: 2
        harm_score: 8
        notes: "FOIA enacted 1966 (LBJ signed grudgingly). BUT: Pentagon Papers documented systematic public deception about Vietnam war progress and decision-making."
        evidence:
          - citation: "Freedom of Information Act, Public Law 89-487 (1966); Pentagon Papers (leaked 1971, fully declassified 2011)"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "LBJ signed FOIA (1966) while simultaneously operating the systematic Vietnam deception documented in Pentagon Papers."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Citation corrected: Pentagon Papers were leaked/published in 1971, not declassified until 2011."
  - category: 5
    name: "Domestic welfare & health"
    category_notes: "Era-defining 10-good anchor. Medicare and Medicaid 1965, ESEA 1965, Head Start, food stamps expansion, Great Society programs."
    sub_criteria:
      - id: "5.1"
        name: "Healthcare access & outcomes"
        good_score: 10
        harm_score: 0
        era_context: "E5 — era-defining 10-good anchor"
        notes: "Medicare (Title XVIII) and Medicaid (Title XIX) enacted via Social Security Amendments of 1965. Most consequential US healthcare legislation until ACA (2010)."

recency_note: "Out of office ~1.3 years per scoring date 2026-05-11. Per v1.2 §9.4: ≤5 years post-term → Cat 10 dropped from weighted total; insufficient_time_elapsed flag set. Other 12 categories proportionally reweighted per lens vectors."

categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Inherited COVID-19 crisis and ~6.7% unemployment. Recovery rapid initially. Inflation surged 2021-2022 (peaked 9.1% June 2022). Cooled by 2024. Strong job creation overall."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 7
        harm_score: 3
        notes: "Unemployment fell from 6.7% (Jan 2021) to 4.1% (Jan 2025). ~16 million jobs added — strongest 4-year job creation since Carter. Real GDP grew ~2.5%/year average."
        evidence:
          - citation: "BLS unemployment and BEA real GDP data 2021-2025"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Biden term saw approximately 16 million net new jobs (largest 4-year addition since Carter); unemployment reached 50-year low (3.4% January 2023); growth steady ~2.5%/year."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "BLS/BEA data confirm all three parts: ~16.1M net jobs (largest single-term gain since Carter), 3.4% unemployment in Jan 2023 (lowest since 1969, ~54-yr low), and growth of 2.5-2.8%/yr in 2022-2024."
              suggested_fix: "Deep-link the jobs series: https://data.bls.gov/timeseries/CES0000000001 ; cf. FactCheck \"Biden's Final Numbers\" gives 15.4M (end-month/vintage difference), but ~16M and \"largest since Carter\" hold per BLS/Wikipedia term table."
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 5
        harm_score: 4
        notes: "ARP 2021 child tax credit expansion temporarily halved child poverty. Expansion expired late 2021 — child poverty doubled. Real wage growth at bottom strong; top-1% share continued rising overall."
        evidence:
          - citation: "American Rescue Plan Act of 2021, Public Law 117-2; Census child poverty data"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "ARP expanded Child Tax Credit to $3,000-3,600 with monthly payments, halving child poverty 2021; expiration end-2021 doubled child poverty back; bottom-quartile real-wage growth strong but inequality trajectory continued."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Census/JEC/CBPP confirm ARP raised CTC to $3,000-3,600 with monthly payments, cutting SPM child poverty from 9.7% to 5.2% in 2021 then rising to 12.4% in 2022 after expiration; bottom-quartile real-wage growth was strongest while inequality returned to trend."
              suggested_fix: "Replace bare homepage with a deep link: https://www.census.gov/content/dam/Census/library/working-papers/2022/demo/sehsd-wp2022-24.pdf (Census SPM impact paper)"
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 3
        harm_score: 6
        notes: "ARP $1.9T + Infrastructure $1.2T + CHIPS $280B + IRA $370B major spending. Federal debt rose from $27.8T to $36T. Annual deficit ~5-7% of GDP. Continued fiscal expansion."
        evidence:
          - citation: "OMB Historical Tables; major Biden-era spending legislation"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: statistic
            tier: 1
            claim: "Federal debt rose from $27.8T to ~$36T during Biden's term; annual deficits ran from ~12.4% of GDP in FY2021 (the pandemic-recovery peak) down to ~5.5-6.4% in FY2022-2024; major spending legislation (ARP, Infrastructure, CHIPS, IRA) totaled ~$3T over a multi-year period."
            direction: harm
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Corrected the deficit range to include FY2021's 12.4% (~$2.8T) peak, which the prior '~5-7%' band omitted."
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 7
        harm_score: 3
        notes: "Real wage growth strongest in bottom quartile in decades. NLRB strengthened. Strong union support ('most pro-union president'). Walked UAW picket line (Sept 2023) — first sitting president to do so."
        evidence:
          - citation: "BLS bottom-quartile real-wage data; Biden UAW picket line September 26, 2023"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Biden era saw strongest bottom-quartile real-wage growth in decades; first sitting president to walk a picket line (UAW September 2023); strengthened federal labor enforcement."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "All three parts confirmed: EPI shows ~13-15% real wage growth for the lowest-wage workers (2019-2024), fastest in over half a century; Biden joined the UAW picket line Sept 26, 2023 as the first sitting president (NBC/CNN/NPR/WaPo); and labor enforcement strengthened (first NLRB funding rise since 2014, +44% worker recoveries year one)."
              suggested_fix: "Source homepage bls.gov is bare; deep link for low-wage growth: https://www.epi.org/publication/swa-wages-2023/ (and picket line: https://www.nbcnews.com/politics/white-house/biden-makes-history-striking-auto-workers-picket-line-rcna117348)"


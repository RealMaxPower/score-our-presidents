categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Inherited Reagan-era expansion's end. 1990-91 recession. 1990 budget deal ('read my lips' tax increase) restored fiscal discipline. Slow recovery cost reelection."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 4
        harm_score: 5
        notes: "1990-91 recession. Unemployment rose from 5.4% (Jan 1989) to 7.8% (Jun 1992). Slow recovery cost election."
        evidence:
          - citation: "BLS unemployment data 1989-1993; NBER recession dating July 1990 - March 1991"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Eight-month recession (July 1990-March 1991) followed by slow 'jobless recovery'; unemployment didn't peak until June 1992 election year."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "NBER dates the recession July 1990-March 1991 (8 months), and BLS data confirm unemployment peaked at 7.8% in June 1992 after a lagging \"jobless recovery\"; all figures, dates, and characterizations are accurate."
              suggested_fix: "For the bare BLS homepage, a deep link: https://www.nber.org/research/data/us-business-cycle-expansions-and-contractions (recession dates) and https://fred.stlouisfed.org/series/UNRATE (monthly unemployment)."
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 4
        harm_score: 4
        notes: "Inequality continued rising. 1990 budget deal raised top marginal rate from 28% to 31%. Modest reversal of Reagan inequality trajectory."
        evidence:
          - citation: "Omnibus Budget Reconciliation Act of 1990, Public Law 101-508"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "1990 OBRA raised top marginal rate from 28% to 31% — first reversal of Reagan-era top-bracket cuts; modest impact on inequality trajectory."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "OBRA-90 (P.L. 101-508), signed by Bush Nov 5 1990, raised the top statutory rate from 28% to 31%; this was the first increase to the top rate after Reagan's 1981/1986 cuts (the 28% top rate dated from the 1986 Tax Reform Act), confirming all stated specifics."
              suggested_fix: "https://en.wikipedia.org/wiki/Omnibus_Budget_Reconciliation_Act_of_1990"
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 7
        harm_score: 3
        notes: "1990 budget agreement raised taxes and created pay-as-you-go rules. Set up 1990s fiscal consolidation. Politically costly ('read my lips')."
        evidence:
          - citation: "1990 Budget Enforcement Act provisions (PAYGO rules)"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "1990 budget deal created pay-as-you-go rules that helped enable the 1990s deficit reduction and eventual budget surpluses."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "The 1990 Budget Enforcement Act (part of OBRA-90, signed by Bush Nov 5, 1990) created PAYGO rules and discretionary caps, which CRFB, Wikipedia, and Tax Policy Center confirm played a large role in 1990s deficit reduction and the 1998-2000 surpluses, matching the claim's hedged wording."
              suggested_fix: "For the bare congress.gov homepage, a better deep link is https://www.crfb.org/blogs/remember-remember-omnibus-budget-reconciliation-act-1990 or https://en.wikipedia.org/wiki/Budget_Enforcement_Act_of_1990"
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 4
        harm_score: 4
        notes: "Real wages stagnant. Union density continued declining. NAFTA negotiated (signed by Clinton)."
        evidence:
          - citation: "NAFTA negotiations 1990-1992"
            source_url: "https://history.state.gov/"
            source_type: historical_record
            tier: 1
            claim: "NAFTA negotiations completed under GHW Bush; framework set for subsequent labor-market dislocation."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "NAFTA negotiations were completed under GHW Bush (announced Aug 12, 1992; initialed Oct 7, 1992; signed by Bush Dec 17, 1992), with implementation under Clinton in 1994; the \"1990-1992\" window and labor-dislocation framing are reasonable, though formal negotiations launched in 1991."
              suggested_fix: "https://history.state.gov/milestones/1993-2000/nafta — or the Bush Presidential Papers \"Remarks Announcing the Completion of Negotiations on the North American Free Trade Agreement\" (Aug 12, 1992)."

  - category: 2

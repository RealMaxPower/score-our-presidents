categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Strongest 8-year economic record of modern presidency. Budget surpluses 1998-2001. Tech boom. Inequality continued rising. Glass-Steagall repeal seeded 2008 crisis."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 9
        harm_score: 1
        notes: "Unemployment fell from 7.3% (Jan 1993) to 4.2% (Jan 2001). Real GDP grew ~4%/year average. ~22 million jobs added. Among strongest 8-year economic records of modern era."
        evidence:
          - citation: "BLS unemployment and BEA real GDP data 1993-2001"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Clinton presided over longest economic expansion in US history to that point; unemployment reached 30-year low (3.8% in April 2000); ~22 million net jobs added."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "NBER confirms the 1991-2001 expansion (120 mo) was the longest in US history to that point; BLS shows 3.8% unemployment in April 2000 (a ~30-year low); jobs added ~21-22.4M per FactCheck.org and White House data, making \"~22 million\" accurate."
              suggested_fix: "For the unemployment series, a deep link is https://data.bls.gov/timeseries/LNS14000000 ; the longest-expansion claim is documented at https://www.nber.org/research/data/us-business-cycle-expansions-and-contractions"
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 5
        harm_score: 4
        notes: "Top-decile share continued rising despite strong economy. EITC major expansion (1993). Some mobility improvement during late-1990s boom."
        evidence:
          - citation: "Piketty & Saez income share data 1993-2001 (Saez \"Striking it Richer,\" TabFig2022, https://eml.berkeley.edu/~saez/TabFig2022.xlsx); OBRA 1993 EITC expansion"
            source_url: "canonical"
            source_type: statistic
            tier: 1
            claim: "Top 1% income share (excl. capital gains) rose from ~13.5% (1992) to ~16.5% (2000) despite strong economy; EITC expansion partially offset inequality at bottom."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Corrected the top 1% income share figures to 13.5% (1992) and 16.5% (2000) excluding capital gains per official Saez/Piketty data, and updated the citation with the specific Saez source/URL."
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 10
        harm_score: 1
        era_context: "E1 — era-defining 10-good for fiscal trajectory"
        notes: "Four consecutive budget surpluses (FY1998-2001), first since 1969. Debt-to-GDP fell from ~63% (1993) to ~55% (2001). OBRA 1993 + 1990 PAYGO + tech boom + spending restraint."
        evidence:
          - citation: "Omnibus Budget Reconciliation Act of 1993, Public Law 103-66; OMB Historical Tables"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: primary_document
            tier: 1
            claim: "OBRA 1993 raised top marginal rate to 39.6% and increased gasoline tax, combined with PAYGO discipline and tech-boom revenue produced four consecutive surpluses (FY1998-2001)."
            direction: good
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Every component checks out: OBRA 1993 raised the top rate from 31% to 39.6% and added a 4.3-cent gas tax, extended PAYGO, and FY1998-2001 were the only four consecutive surplus years since 1969 (~$69B/$236B peak/$128B)."
              suggested_fix: "For a deeper authoritative link, use the OMB Historical Tables direct PDF (Table 1.1, Summary of Receipts, Outlays, and Surpluses or Deficits): https://www.whitehouse.gov/wp-content/uploads/2025/02/hist01z1_fy2026.xlsx"
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 6
        harm_score: 3
        notes: "Real wages rose substantially during late-1990s tightening labor market. Minimum wage raised 1996. NAFTA labor displacement contested."
        evidence:
          - citation: "Census real median household income 1993-2000 (P60-213, https://www2.census.gov/library/publications/2001/demographics/p60-213.pdf); BLS real median weekly earnings (FRED LES1252881600Q); Minimum Wage Increase Act 1996"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Real median household income rose ~12-15% during Clinton term (1993-2000), with real median weekly earnings rising more modestly (~3-7%) amid the strongest sustained real-wage growth since 1970s; NAFTA produced manufacturing job displacement that emerged as political issue subsequently."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Reattributed the \"~15%\" figure from BLS real median wages to real median household income (~12-15%, with weekly earnings up only ~3-7%) and updated the citation to the Census P60-213 source plus the FRED earnings series."
  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.4 Unipolar moment. Kosovo intervention (1999) without UN authorization. Somalia withdrawal after Mogadishu. Rwanda inaction. Bosnia eventual intervention."
    sub_criteria:
      - id: "2.1"
        name: "War & peace decisions"
        good_score: 6
        harm_score: 5
        era_context: "E2.4 Unipolar"
        notes: "Bosnia intervention (Dayton 1995) ended war. Kosovo air war (1999) without UN authorization. Somalia withdrawal after Mogadishu. Rwanda non-intervention catastrophic."
        evidence:
          - citation: "Dayton Accords November 1995; Kosovo bombing campaign March-June 1999; Rwanda Genocide April-July 1994"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "Clinton successfully intervened in Bosnia (Dayton) and Kosovo; failed to intervene in Rwanda Genocide (800,000 deaths) — later called his 'greatest regret.'"
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Dayton Accords (Nov 1995), Kosovo bombing (Mar 24-Jun 10 1999), and Rwanda genocide (Apr-Jul 1994, 800k+ deaths) all confirmed; Clinton repeatedly called Rwanda non-intervention among his greatest regrets, though precise phrasing is \"one of\" his greatest regrets."
              suggested_fix: "For Dayton/Kosovo deep link: https://history.state.gov/milestones/1993-2000/dayton ; Rwanda death toll/regret best sourced via Britannica (britannica.com/event/Rwanda-genocide-of-1994) and ABC/PBS Clinton interviews."
      - id: "2.2"
        name: "Alliance management"
        good_score: 7
        harm_score: 3
        notes: "NATO expansion (Poland, Hungary, Czech Republic 1999). Russia relations mixed. Asian allies maintained. Kosovo coalition. NAFTA partners."
        evidence:
          - citation: "NATO enlargement 1999 (first post-Cold-War expansion); Partnership for Peace 1994"
            source_url: "https://www.nato.int/"
            source_type: primary_document
            tier: 1
            claim: "Clinton oversaw first post-Cold-War NATO expansion to Poland, Hungary, Czech Republic; established framework for subsequent expansion that Russia later cited as grievance."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "NATO and Wikipedia confirm Poland, Hungary, Czech Republic joined March 12, 1999 (first round of new members post-Cold War, under Clinton), Partnership for Peace launched Jan 1994, and Russia repeatedly cites NATO expansion as a grievance."
              suggested_fix: "Deep link for nato.int homepage: https://www.nato.int/cps/en/natohq/topics_49212.htm (Enlargement and Article 10)"
      - id: "2.3"
        name: "Diplomacy & soft power"
        good_score: 7
        harm_score: 3
        notes: "Oslo Accords (1993). Good Friday Agreement (1998). Camp David II (2000) failed. NPT extension. Strong soft power era."
        evidence:
          - citation: "Oslo Accords September 13, 1993; Good Friday Agreement April 10, 1998 (https://history.state.gov/milestones/1993-2000/oslo)"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "Clinton hosted the signing of and facilitated implementation of the Oslo Accords (Israel-PLO) and brokered the Good Friday Agreement (Northern Ireland), two major peace processes; subsequent collapse of Oslo damaged legacy."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Reworded Oslo from \"brokered\" to \"hosted the signing of and facilitated implementation of\" (Norway brokered it), kept \"brokered\" for Good Friday, and added the State Dept Oslo milestone URL to the citation."
      - id: "2.4"
        name: "Civilian impact"
        good_score: 4
        harm_score: 6
        era_context: "E2.4 — Rwanda inaction as principal harm vector"
        notes: "Rwanda Genocide (April-July 1994, ~800,000 deaths) — failure to intervene. Iraq sanctions civilian impact severe. Kosovo war ~500 civilian deaths from NATO bombing."
        evidence:
          - citation: "UN Independent Inquiry on Rwanda (1999); 1999 UNICEF Iraq survey, contradicted by Dyson & Cetorelli, BMJ Global Health (2017)"
            source_url: "https://www.un.org/"
            source_type: primary_document
            tier: 1
            claim: "Clinton later acknowledged Rwanda non-intervention as his greatest foreign-policy regret; a 1999 UNICEF survey attributed 500,000+ excess Iraqi child deaths to 1990s sanctions, but that figure has since been largely discredited (post-2003 surveys and a 2017 BMJ Global Health study found no such mortality rise, the original data likely manipulated by Saddam's regime)."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Reframed the 500,000 Iraqi child-death figure as a disputed/discredited 1999 UNICEF estimate rather than fact (contradicted by post-2003 surveys and BMJ 2017)."
  - category: 3

            source_type: primary_document
            tier: 1
            claim: "Bush administration advanced unitary executive theory through OLC torture memos, signing statements, and indefinite detention authority; SCOTUS rejected several core claims (Hamdi, Hamdan, Boumediene)."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "All four elements verify: Bybee/Yoo OLC memos (Aug 1, 2002) invoked unitary-executive theory; Bush challenged ~1,200 provisions via signing statements; Guantanamo indefinite detention; and Hamdi (542 U.S. 507), Hamdan (548 U.S. 557), and Boumediene (553 U.S. 723) each rejected core executive claims."

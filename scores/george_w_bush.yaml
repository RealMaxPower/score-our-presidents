  - category: 4
    name: "Civil liberties & rule of law"
    category_notes: "Era E4.4 War on Terror — era-defining era-10-harm anchor. Patriot Act, mass surveillance, torture program, indefinite detention, signing statements. Defining civil-liberties failure of modern presidency."
    sub_criteria:
      - id: "4.1"
        name: "Speech & press posture"
        good_score: 3
        harm_score: 6
        notes: "Free Speech Zones for protests. AP and other journalist phone records subpoenaed. NYT Pulitzer winning Times-Risen NSA reporting prosecuted. Mixed pattern."

categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Two recessions (2001 dot-com bust; 2007-09 Great Recession). Tax cuts (2001, 2003). Housing boom and bust. TARP (2008)."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 3
        harm_score: 7
        notes: "2001 recession (mild). 2007-2009 Great Recession (most severe since Great Depression). Unemployment from 4.2% (Jan 2001) to 7.8% (Jan 2009). Net jobs near zero over 8 years."
        evidence:
          - citation: "BLS unemployment data 2001-2009; NBER recession dating"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "GW Bush term spanned two recessions including Great Recession of 2007-2009; net job creation across 8 years was approximately zero — worst since Hoover."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "NBER confirms both recessions (Mar-Nov 2001; Dec 2007-Jun 2009); net nonfarm payroll growth over 8 years was only ~+1.3M (~+1%), the worst of any administration since Hoover — \"approximately zero\" is a fair shorthand though technically a small positive."
              suggested_fix: "For a precise deep link see https://en.wikipedia.org/wiki/Jobs_created_during_U.S._presidential_terms (net ~+1.37M, +1.03%); consider \"near-flat (~+1%)\" rather than literally \"zero.\""
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 2
        harm_score: 7
        notes: "Top 1% income share rose from ~17% (2000) to ~19% (2008). Tax cuts disproportionately benefited high earners. Bush tax cuts (2001, 2003) ended 1990s fiscal balance."
        evidence:
          - citation: "Economic Growth and Tax Relief Reconciliation Act of 2001, Public Law 107-16; Jobs and Growth Tax Relief Reconciliation Act of 2003, Public Law 108-27"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "The Bush tax cuts substantially reduced top marginal rates and capital-gains/dividend taxes, with benefits skewed toward higher earners (ITEP estimated ~65% of the 2000-2018 cuts flowed to the top quintile, a figure that spans the Bush, Obama and Trump cuts)."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Fixed attribution: the '65% to top quintile' figure is ITEP (not CBO) and covers all 2000-2018 cuts, not just Bush's."
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 1
        harm_score: 8
        notes: "Inherited budget surplus (2001) → $1.4T deficit (2009). Federal debt rose from $5.7T to $10.6T. Tax cuts + Iraq War + Medicare Part D + TARP without revenue offsets."
        evidence:
          - citation: "OMB Historical Tables; CBO budget projections 2001-2009"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: statistic
            tier: 1
            claim: "Federal debt nearly doubled during GW Bush term ($5.7T to $10.6T); inherited surplus converted to $1.4T deficit; debt-to-GDP rose from ~55% to ~74%."
            direction: harm
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "Treasury/CBO/OMB data confirm gross debt ~$5.7T (Jan 2001) to ~$10.6T (Jan 2009, nearly doubled), inherited surplus to CBO-confirmed $1.4T FY2009 deficit, and gross debt-to-GDP ~55% (FY2001) rising past ~74% by Bush's exit (FY2008 67.7%, FY2009 82.2%); FY2009 deficit is partly Obama's but framing is standard."
              suggested_fix: "https://www.whitehouse.gov/omb/budget/historical-tables/ (use Table 7.1, \"Federal Debt at the End of Year\") for the exact gross-debt and debt-to-GDP figures cited."
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 3
        harm_score: 6
        notes: "Real wages flat. Union density continued declining. Manufacturing jobs lost. Late-term Great Recession devastated working-class employment."
        evidence:
          - citation: "BLS real wages and manufacturing employment data 2001-2009"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Manufacturing employment fell by approximately 4.5 million during GW Bush term; real median household income fell ~5% from 2001 to 2009."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "BLS MANEMP shows manufacturing fell ~17.1M (Jan 2001) to ~12.56M (Jan 2009), about -4.5M (AFL-CIO/BLS cites -4.6M, 27%); Census real median household income (2014$) fell ~$53,646 to ~$50,599, about -5.7%, so both figures hold."
              suggested_fix: "Deep links: manufacturing series https://fred.stlouisfed.org/series/MANEMP (BLS CES3000000001); income https://www.census.gov/data/tables/time-series/demo/income-poverty/historical-income-households.html (Table H-8). Note income is Census-sourced, not strictly BLS."

  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.4 Unipolar. 9/11 redefined foreign policy. Afghanistan and Iraq wars. Torture program. Guantanamo. PEPFAR positive. Single most consequential foreign-policy presidency since LBJ."
    sub_criteria:
      - id: "2.1"
        name: "War & peace decisions"
        good_score: 2
        harm_score: 9
        era_context: "E2.4 — Iraq War as era-defining 10-harm anchor"
        notes: "Afghanistan War (October 2001) — justified response to 9/11. Iraq War (March 2003) — invasion based on flawed WMD intelligence; ~4,500 US military deaths, ~200K+ Iraqi deaths. Defining foreign-policy failure of 21st century."
        evidence:
          - citation: "Authorization for Use of Military Force Against Iraq Resolution of 2002, Public Law 107-243; Iraq Study Group Report (2006)"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "Iraq invasion was undertaken on premise of WMD that did not exist; war produced ~4,500 US military deaths, ~200,000+ Iraqi deaths, regional destabilization, and rise of ISIS."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "All four elements check out: Duelfer/ISG confirmed no WMD stockpiles; DoD/DCAS shows ~4,419-4,431 US military deaths (~4,500 rounded); Iraq Body Count documents 187k-210k civilian deaths (200,000+); and de-Baathification/AQI-to-ISIS lineage is well-established, though the cited AUMF/ISG Report don't directly source the casualty figures."
              suggested_fix: "For the casualty/WMD specifics, cite primary sources directly: DoD DCAS OIF deaths (https://dcas.dmdc.osd.mil/dcas/app/conflictCasualties/oif/byCategory), Iraq Body Count (https://www.iraqbodycount.org/), and the Duelfer Report (https://www.govinfo.gov/app/details/GPO-DUELFERREPORT); the congress.gov AUMF deep link is https://www.congress.gov/bill/107th-congress/house-joint-resolution/114."
      - id: "2.2"
        name: "Alliance management"
        good_score: 4
        harm_score: 6
        notes: "Strong post-9/11 alliance solidarity. Iraq War fractured NATO consensus (Germany, France opposed). 'Old Europe' rhetoric damaging. UK-US 'special relationship' maintained."
        evidence:
          - citation: "Iraq War coalition (Coalition of the Willing) March 2003; NATO Article 5 invocation September 12, 2001"
            source_url: "https://www.nato.int/"
            source_type: primary_document
            tier: 1
            claim: "NATO invoked Article 5 for first time after 9/11; Iraq War subsequently fractured NATO consensus with Germany and France in active opposition."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "NATO confirms Article 5 was invoked for the first/only time after 9/11 (agreed Sept 12, 2001), and that the 2003 Iraq campaign divided members—France and Germany (with Belgium) actively opposed it and blocked NATO defensive planning for Turkey."
              suggested_fix: "https://www.nato.int/en/what-we-do/operations-and-missions/nato-and-the-2003-campaign-against-iraq"
      - id: "2.3"
        name: "Diplomacy & soft power"
        good_score: 3
        harm_score: 7
        notes: "'Axis of Evil' framing. Withdrawal from ABM Treaty 2002. Withdrew from Kyoto. North Korea diplomacy late-term. PEPFAR (HIV/AIDS) positive soft power."
        evidence:
          - citation: "State of the Union 'Axis of Evil' speech January 29, 2002; ABM Treaty withdrawal December 13, 2001"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "GW Bush framework rejected detente-era arms-control institutions and engaged adversaries through confrontational rhetoric; US soft power declined substantially during term per international polling."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "Both cited events are accurate (ABM withdrawal announced Dec 13 2001; \"axis of evil\" SOTU Jan 29 2002), the ABM Treaty is a genuine detente-era institution, and Pew Global Attitudes confirms substantial US favorability decline (e.g., UK 75%→48%, Italy 70%→34%, down in 26 of 33 countries 2002–2007)."
              suggested_fix: "For sourceUrl, a deeper link: https://www.pewresearch.org/global/2007/06/27/global-unease-with-major-world-powers/ (soft-power decline) and https://history.state.gov/milestones/2001-2008 (ABM withdrawal context)."
      - id: "2.4"
        name: "Civilian impact"
        good_score: 2
        harm_score: 9
        era_context: "E2.4 — Iraq civilian impact major harm"
        notes: "Iraq War civilian deaths: 200,000-1,000,000+ estimates depending on methodology. Afghanistan continued. Detention of thousands without charge. Abu Ghraib torture. Major civilian-impact harm."
        evidence:
          - citation: "Burnham, Lafta, Doocy, Roberts, 'Mortality after the 2003 invasion of Iraq', The Lancet (Oct 2006) estimating 654,965 excess deaths through July 2006; Iraq Body Count documented deaths database"
            source_url: "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(06)69491-9/fulltext"
            source_type: academic
            tier: 1
            claim: "Estimates of Iraq War deaths span methodologies: The Lancet (Oct 2006) survey estimated 654,965 total excess Iraqi deaths through July 2006 (95% CI 393K-943K); Iraq Body Count's media-documented civilian total stood at roughly 100,000-110,000 by Bush's term-end (Jan 2009). Subsequent ISIS emergence and sectarian conflict produced additional deaths."
            direction: harm
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Corrected the Iraq Body Count figure (~100-110k documented civilian deaths by Jan 2009, not ~150k, which was reached in 2010); clarified Lancet 654,965 is total excess deaths."

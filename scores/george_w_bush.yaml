          - citation: "James Risen subpoena (2008, Sterling/Operation Merlin case); Free Speech Zone policies 2001-2008"
            source_url: "canonical"
            source_type: historical_record
            tier: 1
            claim: "Bush's DOJ subpoenaed journalist James Risen to compel his sources for reporting on a CIA operation (the Sterling/Operation Merlin case); the administration also imposed 'free speech zone' press restrictions."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Corrected the subpoena target: it sought Risen's sources for his CIA Operation Merlin/Sterling reporting, not his NSA reporting."
      - id: "4.2"
        name: "Search, seizure, and surveillance"
        good_score: 1
        harm_score: 10
        era_context: "E4.4 — era-defining 10-harm anchor"
        notes: "USA PATRIOT Act 2001 expanded surveillance authority dramatically. NSA warrantless wiretapping program 2001-2007 (revealed 2005 by NYT). Mass metadata collection. FISA Amendments Act 2008. Defining surveillance overreach of modern era."
        evidence:
          - citation: "USA PATRIOT Act, Public Law 107-56 (October 26, 2001); NSA Terrorist Surveillance Program (revealed by NYT December 2005)"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "Patriot Act expanded federal surveillance authority dramatically; warrantless wiretapping program operated 2001-2007 in apparent violation of FISA before retroactive legalization in 2008 FISA Amendments."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "Patriot Act (PL 107-56, Oct 26 2001) expanded surveillance; NSA warrantless program ran 2001-Jan 2007 without FISA warrants (ruled to violate FISA in ACLU v. NSA, 2006), revealed by NYT Dec 16 2005, and the July 2008 FISA Amendments Act expanded authority plus granted telecom retroactive immunity — all accurate, though \"retroactive legalization\" slightly overstates the telecom-immunity grant."
              suggested_fix: "https://en.wikipedia.org/wiki/NSA_warrantless_surveillance_(2001%E2%80%932007)"
      - id: "4.3"
        name: "Executive restraint"
        good_score: 1
        harm_score: 10
        era_context: "E4.4 — era-defining 10-harm anchor"
        notes: "Unitary executive theory advanced via OLC memos. Yoo torture memos. 1,200+ signing statements. Indefinite detention without charge (Guantanamo). 'Enemy combatant' framework. Extraordinary rendition."
        evidence:

categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Stagflation onset. Closed gold window (1971), ending Bretton Woods. Wage-price controls (1971). 1973 oil shock recession. OSHA and EPA brought significant regulatory expansion."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 4
        harm_score: 5
        low_confidence: false
        notes: "1969-70 recession; 1973-75 recession (1973 oil shock). Inflation rising throughout term. Unemployment 3.5% (1969) to 6.6% (mid-1971) and 5.6% (1974)."
        evidence:
          - citation: "BLS unemployment and CPI data 1969-1974; NBER recession dating"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Stagflation onset under Nixon: inflation rose from 5.5% (1969) to 11% (1974) while unemployment also rose, breaking the Phillips Curve relationship that had defined postwar macroeconomic management."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "BLS/CPI data confirm annual inflation rose from 5.5% (1969) to 11.0% (1974) and unemployment also rose (3.5%→5.6% annual avg), matching the claim; the resulting simultaneous rise is the textbook stagflation/Phillips-Curve breakdown."
              suggested_fix: "Cite a deep link, e.g. https://www.usinflationcalculator.com/inflation/historical-inflation-rates/ for CPI and FRED UNRATE (https://fred.stlouisfed.org/series/UNRATE) for unemployment, since sourceUrl is a bare BLS homepage."
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 5
        harm_score: 3
        low_confidence: false
        notes: "Inequality relatively flat. End of Great Compression. Earned Income Tax Credit proposed (later enacted under Ford). SSI replacement of state programs reduced inequality at the bottom."
        evidence:
          - citation: "Piketty & Saez income share data 1969-1974 (https://eml.berkeley.edu/~saez/saez-UStopincomes-2022.pdf; WID at https://wid.world/country/usa/)"
            source_url: "canonical"
            source_type: statistic
            tier: 1
            claim: "Top-decile income share remained ~32-33% throughout Nixon years; Great Compression continued holding but ending."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Lowered the overstated top-decile share from \"~33-34%\" to \"~32-33%\" per the note, and added the deeper Saez 2022 and WID source URLs to the citation."
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 4
        harm_score: 4
        low_confidence: false
        notes: "Closed gold window August 15, 1971 ending Bretton Woods fixed-exchange-rate system. Deficits returned. Wage-price controls (Aug 1971-Apr 1974) controversial."
        evidence:
          - citation: "Nixon Shock, August 15, 1971: suspension of dollar-gold convertibility (presidential directive); Executive Order 11615 imposed the 90-day wage/price freeze and Proclamation 4074 the 10% import surcharge. See https://history.state.gov/milestones/1969-1976/nixon-shock; OMB Historical Tables"
            source_url: "https://www.archives.gov/"
            source_type: primary_document
            tier: 1
            claim: "The Nixon Shock ended the Bretton Woods gold standard, restructuring international monetary system; effects on US fiscal trajectory mixed but the structural change was profound."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Corrected the citation so the gold-convertibility suspension is cited as a separate directive rather than EO 11615 (the wage/price freeze), added Proclamation 4074 and the State Dept milestone URL, and left the claim text unchanged."
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 6
        harm_score: 3
        low_confidence: false
        notes: "OSHA created (1970) — major worker-safety federal expansion. Wage-price controls had mixed labor effects. Real wages flat to declining."
        evidence:
          - citation: "Occupational Safety and Health Act of 1970, Public Law 91-596; OSHA Commonly Used Statistics, https://www.osha.gov/data/commonstats"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "OSHA Act created federal workplace-safety regulation, the major worker-protection federal expansion of the era; ~60% reduction in workplace fatalities (from ~38 deaths/day in 1970 to ~15/day in 2023) attributed to OSHA."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Revised the understated \"~50%\" fatality reduction to OSHA's own ~60% figure (38 deaths/day in 1970 to 15/day in 2023) and added the OSHA commonstats deep link to the citation."
  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.3 Cold War. Opening to China and detente with USSR are era-defining good. Cambodia bombing and continued Vietnam War civilian impact are era-10-harm. Paris Peace Accords (1973) ended US Vietnam involvement."
    sub_criteria:
      - id: "2.1"
        name: "War & peace decisions"
        good_score: 5
        harm_score: 6
        low_confidence: false
        era_context: "E2.3 Cold War"
        notes: "Vietnamization (1969 onward). Paris Peace Accords (January 1973) ended US ground combat. BUT: Cambodia secret bombing campaign (1969-1973), Christmas bombing of North Vietnam (December 1972), invasion of Cambodia (1970)."
        evidence:
          - citation: "Paris Peace Accords (January 27, 1973); Operation Menu (Cambodia bombing) declassified records 1969-1970"
            source_url: "canonical"
            source_type: primary_document
            tier: 1
            claim: "Nixon ended US combat involvement in Vietnam via Paris Accords while simultaneously expanding war to Cambodia and Laos in secret bombing campaigns concealed from Congress."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Paris Accords (Jan 27, 1973), Operation Menu secret Cambodia bombing (1969-70) with falsified reports to Congress, and concealed Laos bombing are all well-documented; only the \"simultaneously\" framing is loose since Menu ended ~1970, years before the 1973 Accords."
              suggested_fix: "https://en.wikipedia.org/wiki/Operation_Menu"
      - id: "2.2"
        name: "Alliance management"
        good_score: 8
        harm_score: 2
        low_confidence: false
        notes: "Strategic triangulation US-China-USSR transformed Cold War structure. NATO solid. SALT I and ABM Treaty (1972). Detente with USSR. Some tensions with Allies over Nixon Shock."
        evidence:
          - citation: "Anti-Ballistic Missile Treaty (1972); Strategic Arms Limitation Talks Interim Agreement (1972)"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "Nixon's strategic triangulation and SALT I represented the largest restructuring of Cold War alliance dynamics since the 1940s; ABM Treaty constrained nuclear arms race until US withdrawal in 2002."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "State Dept and Arms Control sources confirm the 1972 ABM Treaty (signed by Nixon/Brezhnev) and SALT I Interim Agreement as the crowning achievement of détente/triangulation, with the ABM Treaty in force until the US withdrawal effective June 2002; the \"largest restructuring since the 1940s\" is defensible interpretive framing."
              suggested_fix: "Deep link: https://history.state.gov/milestones/1969-1976/salt"
      - id: "2.3"
        name: "Diplomacy & soft power"
        good_score: 9
        harm_score: 1
        low_confidence: false
        notes: "Opening to China (February 1972 Beijing visit) ended 22-year diplomatic freeze. Detente architecture with USSR. Moscow Summit (May 1972). Era-defining diplomatic transformation."
        evidence:
          - citation: "Shanghai Communiqué (February 27, 1972, signed in Shanghai); Nixon-Mao meeting February 21, 1972; https://history.state.gov/milestones/1969-1976/rapprochement-china"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "Nixon's 1972 China visit ended more than two decades of US-PRC diplomatic separation and reshaped Cold War strategic balance; among the most consequential diplomatic openings in 20th century US foreign policy."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Corrected the Shanghai Communiqué date from February 28 to February 27, 1972 with the State Department deep link, and softened \"22 years\" to \"more than two decades\" per the note's approximation flag."
      - id: "2.4"
        name: "Civilian impact"
        good_score: 2
        harm_score: 8
        low_confidence: false
        era_context: "E2.3 — score within era's mass-war norms"
        notes: "Cambodia bombing dropped ~500,000 tons of bombs (1969-1973), destabilizing Cambodia and contributing to conditions for Khmer Rouge ascent. Continued Vietnam civilian casualties. Christmas bombing of Hanoi/Haiphong (December 1972)."
        evidence:
          - citation: "Owen & Kiernan, 'Bombs Over Cambodia' (The Walrus, 2006), tonnage revised down by the authors in 2010; declassified US Air Force bombing records"
            source_url: "canonical"
            source_type: academic
            tier: 1
            claim: "US dropped on the order of 500,000 tons of bombs on Cambodia from 1969-1973 under Nixon (an earlier 2.7-million-ton figure was retracted by its authors in 2010 as a database error); the bombing is widely linked to destabilization that enabled the Khmer Rouge takeover and subsequent genocide."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Replaced retracted 2.7M-ton figure with ~500,000 tons per Owen & Kiernan's 2010 correction; bulk-under-Nixon and Khmer Rouge linkage corroborated."
  - category: 3
    name: "Civil rights & equality"
    category_notes: "Era E3.2/E3.3 transition. Substantial good on Title IX, disability rights (Rehab Act 1973), tribal self-determination policy. Mixed on racial equity: enforced school desegregation but used Southern Strategy rhetoric."
    sub_criteria:
      - id: "3.1"
        name: "Racial equity"
        good_score: 5
        harm_score: 4
        low_confidence: false
        era_context: "E3.2 end / E3.3 start"
        notes: "School desegregation peak occurred under Nixon (% of Southern Black students in majority-white schools went from 18% in 1968 to 90% in 1973). Philadelphia Plan (1969) instituted affirmative action in federal contracting. BUT: Southern Strategy political alignment with white backlash."
        evidence:
          - citation: "Philadelphia Plan (DOL Order 4, 1969); school desegregation data via Office for Civil Rights (1968-1973)"
            source_url: "canonical"
            source_type: primary_document
            tier: 1
            claim: "The Philadelphia Plan was the first federal affirmative action requirement; school desegregation in the South accelerated dramatically under Nixon-era enforcement (e.g., Alexander v. Holmes 1969)."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Authoritative sources confirm the Revised Philadelphia Plan (June 1969) as the first federal affirmative action requirement with mandatory goals/timetables, and Alexander v. Holmes (1969) drove dramatic Southern desegregation (~68-70% of Black students in segregated schools in 1968 to ~8-18% by 1972); only the citation \"DOL Order 4, 1969\" is imprecise (Order No. 4 was 1970)."
              suggested_fix: "Fix citation: the Philadelphia Plan order was issued June 27, 1969; the broader DOL \"Order No. 4\" was issued in 1970 (Revised Order No. 4 in 1971). See https://en.wikipedia.org/wiki/Revised_Philadelphia_Plan and https://en.wikipedia.org/wiki/Alexander_v._Holmes_County_Board_of_Education"
      - id: "3.2"
        name: "Gender equity"
        good_score: 7
        harm_score: 2
        low_confidence: false
        notes: "Title IX (1972) — major federal action prohibiting sex discrimination in education. Equal Rights Amendment passed Congress under Nixon (1972). Equal Employment Opportunity Act (1972) extended Title VII coverage."
        evidence:

              suggested_fix: "https://text-message.blogs.archives.gov/2020/11/10/righting-a-wrong-the-return-of-blue-lake-to-the-taos-pueblo/"

  - category: 4
    name: "Civil liberties & rule of law"
    category_notes: "Era E4.2 Cold War surveillance. Watergate-related abuses (Plumbers, Enemies List, IRS abuse, FBI weaponization, Pentagon Papers prosecution) define this category for Nixon. Era-defining 10-harm anchor."
    sub_criteria:
      - id: "4.1"
        name: "Speech & press posture"
        good_score: 3
        harm_score: 7
        low_confidence: false
        notes: "Enemies List of journalists and political opponents. Prosecuted Daniel Ellsberg for Pentagon Papers (case dismissed for government misconduct). VP Agnew's anti-press rhetoric. IRS audits of journalists."
        evidence:
          - citation: "Enemies List entered into Watergate evidence (1973); United States v. Ellsberg case dismissal (May 1973)"
            source_url: "https://www.archives.gov/"
            source_type: primary_document
            tier: 1
            claim: "The Nixon administration maintained a list of political 'enemies' for IRS audit and other federal retaliation; Ellsberg's prosecution was dismissed when the administration's own breaking-and-entering of his psychiatrist's office was revealed."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Dean's \"enemies list\" (public June 1973) explicitly aimed to use IRS audits, grants, contracts, and prosecution against foes (basis for Article 2 of impeachment), and Judge Byrne dismissed Ellsberg's case May 11, 1973 over the Plumbers' break-in at Dr. Fielding's office; one caveat is the IRS audits were mostly intended, not executed (Treasury blocked them)."
              suggested_fix: "https://www.archives.gov/research/investigations/watergate/misuse-of-irs.html"
      - id: "4.2"
        name: "Search, seizure, and surveillance"
        good_score: 1
        harm_score: 9
        low_confidence: false
        notes: "White House Plumbers unit (1971+) committed multiple illegal break-ins and wiretaps. FBI continued COINTELPRO (until 1971 exposure). Wiretapping of NSC staff and journalists. Watergate burglary itself (June 1972)."
        evidence:
          - citation: "Watergate Committee Report (Senate Select Committee, 1974); declassified White House Plumbers operational records"
            source_url: "https://www.senate.gov/"
            source_type: primary_document
            tier: 1
            claim: "The White House Plumbers unit committed the September 1971 burglary of Daniel Ellsberg's psychiatrist (authorized by Krogh and Ehrlichman); the May-June 1972 Watergate break-ins were carried out by CRP operatives. Nixon's proven personal crime was directing the cover-up, not ordering the break-ins themselves."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-27
              note: "Removed 'at presidential direction' (unproven for the break-ins; Fielding burglary authorized by Krogh/Ehrlichman, Watergate run by CRP); underlying felonies corroborated."
      - id: "4.3"
        name: "Executive restraint"
        good_score: 1
        harm_score: 9
        low_confidence: false
        notes: "Cambodia secret bombing (1969-1970) hidden from Congress. Impoundment of appropriated funds led to Impoundment Control Act (1974). War Powers Act (1973) passed over Nixon's veto. Executive privilege expansion."
        evidence:
          - citation: "War Powers Resolution, Public Law 93-148 (1973), passed over Nixon veto; Congressional Budget and Impoundment Control Act of 1974"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "Two major congressional responses — War Powers Resolution and Impoundment Control Act — directly constrained presidential power as reaction to Nixon's expansions; the War Powers Act was specifically designed to prevent future secret wars like Cambodia."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "Authoritative sources (Nixon Library, House History, Wikipedia) confirm both the War Powers Resolution (PL 93-148, passed over Nixon's veto Nov 7 1973) and the Impoundment Control Act of 1974 were direct congressional reactions to Nixon's overreach, with the WPR specifically driven by the secret Cambodia bombings; note only the WPR was over a veto (Nixon signed the Impoundment Act July 12 1974), which the claim correctly attributes."
              suggested_fix: "https://history.house.gov/Historical-Highlights/1951-2000/Congressional-Budget-and-Impoundment-Control-Act-of-1974/ and https://www.nixonlibrary.gov/news/war-powers-resolution-1973"
      - id: "4.4"
        name: "Transparency & FOIA"
        good_score: 1
        harm_score: 9
        low_confidence: false
        notes: "Watergate cover-up itself. 18.5-minute tape gap. Destruction of evidence. Refused tape subpoenas; Saturday Night Massacre (October 1973). FOIA strengthened 1974 amendments over Ford's veto in response."
        evidence:
          - citation: "United States v. Nixon, 418 U.S. 683 (1974); FOIA Amendments of 1974, Public Law 93-502"
            source_url: "https://supreme.justia.com/"
            source_type: primary_document
            tier: 1
            claim: "Nixon's resistance to disclosing White House tapes led to unanimous Supreme Court ruling in US v. Nixon and direct congressional response strengthening FOIA over Ford's veto."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-27
              note: "US v. Nixon, 418 U.S. 683 (1974) unanimously (8-0, Rehnquist recused) ordered the tapes released, and the 1974 FOIA Amendments (PL 93-502) were a Watergate-era strengthening passed over Ford's veto (House 371-31, Senate 65-27), all confirming the claim."
              suggested_fix: "https://supreme.justia.com/cases/federal/us/418/683/"


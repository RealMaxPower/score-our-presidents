            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "Title IX transformed federal anti-discrimination law in education, with major downstream effects on women's athletics, professional schools, and education access."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Title IX (Education Amendments of 1972, PL 92-318, signed by Nixon June 23 1972) is authoritatively documented as transforming federal anti-discrimination law in education with major downstream effects on women's athletics (HS girl athletes 295K→3M+), professional schools (med school ~9.6%→50.5% female), and education access."
              suggested_fix: "https://www.congress.gov/bill/92nd-congress/senate-bill/659 (or LOC guide: https://guides.loc.gov/title-IX-law-library-resources/primary-sources)"

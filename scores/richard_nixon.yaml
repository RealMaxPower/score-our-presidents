            source_url: "canonical"
            source_type: historical_record
            tier: 2
            claim: "Federal anti-LGBTQ employment discrimination policy persisted through most of the Nixon years with no administration-initiated reform, relaxed only under court compulsion when the Civil Service Commission revised its directive in December 1973."

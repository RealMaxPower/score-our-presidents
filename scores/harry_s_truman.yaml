              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "All three elements confirmed: Truman authorized the Hiroshima (Aug 6) and Nagasaki (Aug 9) 1945 atomic bombings ending WWII, and committed US forces to Korea in June 1950 without congressional declaration, which CFR and scholar Lou Fisher cite as the key precedent for undeclared executive war; the July 25, 1945 diary entry is authentic."
              suggested_fix: "Deep link for atomic-bomb decision: https://www.trumanlibrary.gov/education/presidential-inquiries/decision-drop-atomic-bomb ; Korea: https://www.trumanlibrary.gov/education/presidential-inquiries/united-nations-korea"

        name: "Alliance management"
        good_score: 8
        harm_score: 2
        low_confidence: false
        notes: "NATO solidified during Pershing II deployment crisis (1983). Reagan-Thatcher special relationship. Reagan-Gorbachev relationship innovated superpower diplomacy. Some tensions with allies over SDI."

        harm_score: 2
        low_confidence: false
        notes: "Berlin Wall speech (June 1987). Reykjavik Summit (October 1986) nearly achieved abolition of nuclear weapons. INF Treaty. 'Evil Empire' speech (March 1983) provocative but combined with willingness to negotiate."

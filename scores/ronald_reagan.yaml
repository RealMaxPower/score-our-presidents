categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Reaganomics: tax cuts (ERTA 1981, TRA 1986), deregulation, increased defense spending. 1981-82 recession was worst since Great Depression; 1983-89 expansion was strongest postwar. Inequality began rising; debt tripled. Most contested economic legacy of the modern era."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 6
        harm_score: 4
        low_confidence: false
        notes: "1981-82 recession: unemployment peaked at 10.8% (December 1982), worst since Great Depression. Recovery 1983-89: 16 million jobs added; unemployment fell to 5.4% (1989). Real GDP grew ~3.5%/year average across expansion years."
        evidence:
          - citation: "BLS unemployment time series 1981-1989; BEA real GDP growth data"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Severe 1981-82 recession (unemployment peak 10.8%) followed by 92-month expansion (Nov 1982-Jul 1990) adding 16 million jobs and reducing unemployment to 5.4% by end of term."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Corrected the \"84-month expansion\" to the NBER-confirmed \"92-month expansion (Nov 1982-Jul 1990),\" leaving all other wording and the citation unchanged."
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 3
        harm_score: 6
        low_confidence: false
        notes: "Top marginal tax rate cut from 70% (1980) to 28% (1988). Top 1% income share began its sustained rise (~10% in 1980 to ~14% by 1988). End of the Great Compression."
        evidence:
          - citation: "World Inequality Database (WID) pre-tax top-1% income share via Our World in Data: 1980 = 10.4%, 1988 = 15.2% (https://ourworldindata.org/grapher/income-share-top-1-before-tax-wid?country=~USA); CBO 'Trends in the Distribution of Household Income' historical analysis"
            source_url: "canonical"
            source_type: statistic
            tier: 1
            claim: "Top 1% household income share rose from ~10% (1980) to ~15% (1988) under Reagan—though part of the 1986-88 jump reflects a Tax Reform Act of 1986 reporting artifact—ending the Great Compression era and beginning the modern inequality trend that continued through subsequent administrations."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Corrected the 1988 endpoint from ~14% to ~15% to match the WID series, added a brief TRA86 reporting-artifact caveat, and updated the citation to the specific WID/Our World in Data source with figures."
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 2
        harm_score: 7
        low_confidence: false
        notes: "Federal debt nearly tripled: ~$994B (1981) to ~$2.85T (1989). Annual deficits ran ~3-6% of GDP throughout term. Largest peacetime fiscal expansion to that point in US history."
        evidence:
          - citation: "OMB Historical Tables, Table 7.1 Federal Debt; CBO historical revenue/outlay tables"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: statistic
            tier: 1
            claim: "Federal debt rose from ~$994 billion to ~$2.85 trillion under Reagan; debt-to-GDP rose from ~33% to ~52% — largest peacetime debt expansion since WWII."
            direction: harm
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Multiple authoritative sources confirm gross federal debt rose from ~$994B (FY1981) to ~$2.86T (FY1989) with gross debt/GDP rising from ~32.5% to ~53.1%, matching the claim's ~33%-to-~52% and \"largest peacetime debt expansion since WWII\" framing."
              suggested_fix: "Deep link for exact OMB Table 7.1 figures: https://www.whitehouse.gov/omb/budget/Historicals/ (Table 7.1, FY1981 vs FY1989)."
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 3
        harm_score: 6
        low_confidence: false
        notes: "PATCO firing (August 1981) broke air traffic controllers' strike, fired 11,345 employees, decertified union. Set precedent for aggressive private-sector union breaking. Union density fell from 23% (1981) to 17% (1989). Real wages flat for non-supervisory workers."

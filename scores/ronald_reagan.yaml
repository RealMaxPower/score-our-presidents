        name: "War & peace decisions"
        good_score: 7
        harm_score: 4
        low_confidence: false
        era_context: "E2.3 late Cold War"
        notes: "No major war initiated. Grenada invasion (October 1983) small-scale. Libya bombing (April 1986). Lebanon Marine deployment (1982-84) ended after Beirut barracks bombing. Cold War endgame negotiated successfully."
        evidence:
          - citation: "Intermediate-Range Nuclear Forces Treaty (December 8, 1987); Reagan-Gorbachev summits records"
            source_url: "https://www.reaganlibrary.gov/"
            source_type: primary_document
            tier: 1

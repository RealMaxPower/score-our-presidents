            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Authoritative sources (Arms Control Assoc., National Security Archive, Britannica) confirm the INF Treaty (signed Dec 8, 1987) was the first/only treaty to eliminate an entire class of nuclear weapons and marked a Cold War thaw after intense early-1980s confrontation."
              suggested_fix: "https://www.reaganlibrary.gov/archives/speech/white-house-statement-first-anniversary-intermediate-range-nuclear-forces-treaty"

  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.3 late Cold War, transitioning toward E2.4 unipolar moment. Cold War endgame is era-defining good. INF Treaty (1987), Reagan-Gorbachev summits, 'tear down this wall.' BUT: Beirut barracks bombing (1983), Iran-Contra, Central American civil war support, US support for Iraq in Iran-Iraq War."

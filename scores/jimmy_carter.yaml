            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Replaced \"diversity-based\" with \"as a remedy for past discrimination\" to accurately reflect the brief's rationale, since the diversity interest was Justice Powell's, not the brief's."
      - id: "3.2"
        name: "Gender equity"
        good_score: 6

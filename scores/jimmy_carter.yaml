president: jimmy_carter
display_name: "Jimmy Carter"
term_start: 1977-01-20
term_end: 1981-01-20
party: D
terms_served: 1
calibration_anchor: false
spec_version: v1.2

categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Era of stagflation, oil shocks, high interest rates. Volcker appointed Fed chairman (August 1979). Recession 1980. Deregulation began (airlines, trucking, banking)."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 4
        harm_score: 6
        notes: "Unemployment fell early-term then rose with 1980 recession. Inflation peaked 13.5% (1980). Misery index reached 21.98 (June 1980)."
        evidence:
          - citation: "BLS unemployment and CPI data 1977-1981"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Stagflation peaked under Carter: inflation 13.5% (1980), unemployment 7.2% (Dec 1980), ~7.5% through late 1980, 'misery index' reached postwar highs."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Corrected December 1980 unemployment from 7.5% to 7.2%, noting ~7.5% through late 1980."
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 5
        harm_score: 3
        notes: "Inequality relatively flat; stagflation hit middle class. EITC expanded modestly."
        evidence:
          - citation: "Piketty & Saez income share data 1977-1981"
            source_url: "canonical"
            source_type: statistic
            tier: 1
            claim: "Income inequality remained near Great Compression lows under Carter despite stagflation pressures."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Piketty-Saez data confirm the top 1% share sat near its postwar/Great Compression low (~9-10%, down from a ~9.16% 1973 trough) through Carter's 1977-1981 term, with the sustained rise in inequality beginning only at the late-1970s inflection point and accelerating in the 1980s."
              suggested_fix: "https://eml.berkeley.edu/~saez/saez-UStopincomes-2022.pdf (Piketty-Saez top income shares series; see also the underlying TabFig2022.xlsx for year-by-year 1977-1981 values)"
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 4
        harm_score: 4
        notes: "Deficits modest. Inflation eroded debt-to-GDP. Major spending program restraint."
        evidence:
          - citation: "OMB Historical Tables"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: statistic
            tier: 1
            claim: "Federal deficits remained moderate under Carter; debt-to-GDP held roughly stable at ~33%."
            direction: good
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "OMB Table 7.1 shows gross federal debt-to-GDP at ~36% (FY1976/77) easing to ~33% by FY1981, and deficits stayed a moderate ~1.6-2.8% of GDP, matching the claim (note ~33% is the gross-debt measure; debt held by public was lower, ~26%, and the trend was a slight decline rather than perfectly flat)."
              suggested_fix: "https://www.govinfo.gov/content/pkg/BUDGET-2000-TAB/html/BUDGET-2000-TAB-9-1.htm (OMB Historical Table 7.1, Federal Debt as % of GDP)"
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 4
        harm_score: 5
        notes: "Real wages fell substantially due to inflation. Deregulation (airlines, trucking) shifted labor patterns. Minimum wage increased."
        evidence:
          - citation: "BLS real wages data 1977-1981 (PERC analysis: https://perc.tamu.edu/blog/2024/02/presidents-real-wages.html); Motor Carrier Act of 1980 (GAO: https://www.gao.gov/products/122840); Airline Deregulation Act of 1978, Public Law 95-504"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Real wages fell ~8% during Carter term due to inflation; trucking deregulation reduced unionized (Teamster) employment, while airline deregulation's effect on union employment was more limited and largely emerged later."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Corrected the real-wage decline from ~10% to ~8%, replaced the overstated airline-union claim with the better-supported Motor Carrier Act/Teamster trucking evidence while softening the airline impact, and updated the citation with PERC and GAO sources."
  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.3 Cold War late. Camp David Accords (1978), Panama Canal Treaties (1977), China normalization (1979), SALT II signing. BUT: Iran Hostage Crisis (1979-1981), Soviet Afghanistan invasion, failed Desert One rescue."
    sub_criteria:
      - id: "2.1"
        name: "War & peace decisions"
        good_score: 7
        harm_score: 4
        era_context: "E2.3 Cold War"
        notes: "No new wars. Restraint at multiple junctures. Failed Desert One (April 1980) helicopter rescue. Carter Doctrine (1980) committed to Persian Gulf defense."
        evidence:
          - citation: "Operation Eagle Claw (Desert One) April 24, 1980; Carter Doctrine State of the Union January 23, 1980"
            source_url: "https://www.jimmycarterlibrary.gov/"
            source_type: primary_document
            tier: 1
            claim: "Carter maintained foreign-policy restraint despite multiple crises; Desert One rescue mission failed but no escalation to war."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Both dates are exact (Eagle Claw/Desert One Apr 24 1980; Carter Doctrine SOTU Jan 23 1980), the rescue mission did fail killing 8 servicemen, and Carter avoided military escalation to war with Iran throughout the crisis."
              suggested_fix: "https://www.jimmycarterlibrary.gov/research/hostage_crisis_in_iran"
      - id: "2.2"
        name: "Alliance management"
        good_score: 6
        harm_score: 3
        notes: "Normalized PRC relations (January 1, 1979). Panama Canal Treaties (1977). Camp David Accords. Some allied friction (Pershing II controversy emerged)."
        evidence:
          - citation: "Joint US-PRC Communique on Establishment of Diplomatic Relations, January 1, 1979"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "Carter completed US-PRC normalization process begun by Nixon, establishing full diplomatic relations and shifting Taiwan recognition."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "State Dept Office of the Historian and the Joint Communiqué confirm Carter completed Nixon-initiated normalization, establishing full PRC diplomatic relations effective Jan 1, 1979 and shifting recognition from Taiwan; citation accurate."
              suggested_fix: "Use deep link https://history.state.gov/milestones/1977-1980/china-policy instead of the bare homepage."
      - id: "2.3"
        name: "Diplomacy & soft power"
        good_score: 8
        harm_score: 2
        notes: "Camp David Accords (September 1978) — landmark Israel-Egypt peace deal. Human rights as foreign-policy framework. Panama Canal Treaties. SALT II signed (not ratified after Afghanistan invasion)."
        evidence:
          - citation: "Camp David Accords (September 17, 1978); Egyptian-Israeli Peace Treaty (March 26, 1979)"
            source_url: "https://www.jimmycarterlibrary.gov/"
            source_type: primary_document
            tier: 1
            claim: "Camp David Accords produced first peace treaty between Israel and an Arab state, foundational to subsequent Middle East peace process."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Authoritative sources confirm the Camp David Accords (Sept 17, 1978) and Egyptian-Israeli Peace Treaty (March 26, 1979) were the first peace treaty between Israel and an Arab state; \"foundational to subsequent peace process\" is a reasonable framing, though State Dept calls it the Carter-era high-water mark."
              suggested_fix: "https://history.state.gov/milestones/1977-1980/camp-david"
      - id: "2.4"
        name: "Civilian impact"
        good_score: 5
        harm_score: 4
        notes: "Modest direct civilian impact. Support for Indonesia's East Timor occupation continued from Ford era. Indochinese refugee resettlement expansion."
        evidence:
          - citation: "Refugee Act of 1980, Public Law 96-212; East Timor continuation"
            source_url: "https://www.congress.gov/"
            source_type: primary_document
            tier: 1
            claim: "Carter expanded refugee admission framework via Refugee Act of 1980 while continuing US support for Indonesian Timor occupation."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Both parts confirmed: Carter signed the Refugee Act of 1980 (PL 96-212, raising the ceiling to 50,000 and adopting the UN refugee definition), and his administration accelerated military aid to Indonesia (OV-10 Broncos, $250M+) during the East Timor occupation."
              suggested_fix: "https://www.govinfo.gov/content/pkg/STATUTE-94/pdf/STATUTE-94-Pg102.pdf"

  - category: 3
    name: "Civil rights & equality"
    category_notes: "Era E3.3 Consolidation. Continued enforcement of civil rights framework. Section 504 disability regulations issued (1977). Bakke v. Regents (1978) preserved affirmative action."

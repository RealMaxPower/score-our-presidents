            source_url: "https://supreme.justia.com/"
            source_type: primary_document
            tier: 1
            claim: "Carter administration's amicus brief supported affirmative action as a remedy for past discrimination; Bakke ruling preserved AA framework while restricting quotas."
            direction: good

recency_note: "Out of office ~9.3 years per scoring date 2026-05-11. Per v1.2 §9.4: 5-10 years post-term → Cat 10 sub-criteria tagged low_confidence (tentative_long_tail: true)."

categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Inherited Great Recession (worst since Great Depression). Recovery slow but sustained. ARRA stimulus, Dodd-Frank reform. Auto industry rescue. Inequality continued widening."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 7
        harm_score: 3
        notes: "Inherited 7.8% unemployment rising to 10% (Oct 2009); recovery brought to 4.7% (Jan 2017). 11.6 million private-sector jobs added during recovery (longest streak in history)."
        evidence:
          - citation: "BLS unemployment data 2009-2017; BEA GDP data"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Unemployment recovered from 10% (October 2009 peak) to 4.7% (January 2017); 75 consecutive months of private-sector job gains, longest streak in US history."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "BLS/Obama WH confirm 10.0% Oct-2009 peak, 75 straight months of private-sector gains (longest on record since 1939), and ~4.7% by office-end; minor caveats: 4.7% was Dec-2016 (Jan-2017 ticked to 4.8%) and the \"longest in history\" superlative is contested when single-month dips are excluded (Clinton ~85 mo)."
              suggested_fix: "https://obamawhitehouse.archives.gov/blog/2017/01/06/eight-years-labor-market-progress-and-employment-situation-december/ — note 4.7% is the December 2016 rate (January 2017 was 4.8%)."
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 4
        harm_score: 5
        notes: "Top 1% income share continued rising. Recovery benefited high earners disproportionately initially. Bush tax cuts partially extended; top-rate restoration to 39.6% (2013) modest reversal."
        evidence:
          - citation: "Saez \"Striking it Richer\" (TabFig2015prel) https://eml.berkeley.edu/~saez/saez-UStopincomes-2015.pdf; American Taxpayer Relief Act of 2012, Public Law 112-240"
            source_url: "canonical"
            source_type: statistic
            tier: 1
            claim: "Top 1% income share (incl. capital gains) went from ~20.9% (2008) to ~22% (2015); ATRA 2012 restored 39.6% top marginal rate; inequality trajectory continued."
            direction: harm
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Replaced the mixed-series ~17% (2008) figure with the consistent incl.-cap-gains ~20.9% (2008) endpoint and updated the citation to Saez's specific source."
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 4
        harm_score: 5
        notes: "ARRA $787B stimulus + Great Recession revenue collapse + bailouts produced record $1.4T (2009) deficit. Annual deficit fell to $585B by 2016. Debt rose from $10.6T to $19.9T."
        evidence:
          - citation: "OMB Historical Tables; American Recovery and Reinvestment Act of 2009, Public Law 111-5"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: statistic
            tier: 1
            claim: "Federal debt nearly doubled during Obama term ($10.6T to $19.9T) due to ARRA stimulus, Great Recession revenue collapse, and continued Bush tax cuts; annual deficit reduced ~60% from peak."
            direction: harm
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Debt $10.6T→$19.9T (gross, ~88%/\"nearly doubled\"), all three causes (ARRA, recession revenue loss, Bush tax-cut extensions) cited by CRFB/CBPP, and deficit fell from $1.41T peak (FY09) to $587B (FY16) = ~58%, matching \"~60%.\""
              suggested_fix: "Use a deep link instead of the OMB homepage, e.g. https://fiscaldata.treasury.gov/datasets/historical-debt-outstanding/ or CRFB https://www.crfb.org/blogs/has-president-obama-doubled-national-debt"
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 5
        harm_score: 4
        notes: "Real wage growth modest until late-term acceleration. Manufacturing partial recovery via auto bailout. Union density continued declining. Overtime rule expanded (blocked by courts)."
        evidence:
          - citation: "BLS real wages data 2009-2017; Auto Industry Financing and Restructuring Plan 2008-2009"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Auto industry bailout saved estimated 1-1.5 million jobs (GM, Chrysler restructuring); real median household income growth resumed late-term."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Center for Automotive Research backs the 1-1.5M auto-bailout jobs figure, and Census data confirm real median household income resumed growth late-term (+5.2% in 2015, +3.2% in 2016); income data is actually Census/CPS not BLS, a minor citation slip."
              suggested_fix: "For the income claim cite Census Bureau: https://www.census.gov/library/publications/2016/demo/p60-256.html ; for jobs cite Center for Automotive Research's 2010 bailout impact study."

  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.4 late Unipolar / E2.5 multipolar onset. Killed bin Laden. Iran nuclear deal. Paris Agreement. Drone program expansion. Libya intervention. Syria red line. Ukraine and Crimea."

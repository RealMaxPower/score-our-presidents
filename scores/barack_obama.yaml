        harm_score: 5
        era_context: "E2.4 → E2.5 transition"
        notes: "Ended Iraq combat operations (December 2011). Afghanistan surge then drawdown. Libya intervention (2011) destabilizing. Syria 'red line' (2013) not enforced. Drone program dramatically expanded."

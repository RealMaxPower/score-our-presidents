            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "All four components verified: last US troops left Iraq Dec 2011 (war formally ended), Afghanistan surge peaked ~100k then drew down (combat ended 2014), UNSCR 1973 authorized Libya intervention that toppled Gaddafi leaving state collapse, and drone strikes rose ~10x over Bush with disputed civilian-casualty estimates (official 64-116 vs independent 384-807+)."
              suggested_fix: "Use a deep authoritative link instead of the bare homepage, e.g. https://history.state.gov/milestones/2009-2016 or https://obamawhitehouse.archives.gov/the-press-office/2011/10/21/remarks-president-ending-war-iraq"

        name: "Executive restraint"
        good_score: 4
        harm_score: 5
        notes: "Banned torture (EO 13491, January 2009) — major positive. BUT: extended drone program with US-citizen targeting (al-Awlaki). Continued indefinite Guantanamo detention. Used executive authority extensively post-2010."

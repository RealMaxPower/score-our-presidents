              checked_by: human
              checked_at: 2026-06-28
              note: "Scoped the \"Dulles and Nixon\" escalation-pressure attribution to Indochina 1954 and reframed Hungary/Suez as resisting allied and Cold War pressure, and added the State Department Suez milestone deep link to the citation."

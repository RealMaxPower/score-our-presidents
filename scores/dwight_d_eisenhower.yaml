            source_url: "canonical"
            source_type: academic
            tier: 2
            claim: "Eisenhower's 'hidden hand' anti-McCarthy strategy never publicly named McCarthy but starved his investigations of executive cooperation; McCarthy was censured December 1954."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Greenstein's \"hidden hand\" thesis, Ike's documented refusal to publicly name McCarthy, his executive-privilege denial of cooperation, the Dec 2, 1954 censure (67-22), and the Yates 354 U.S. 298 (1957) Smith Act narrowing are all accurate; only nuance is the final resolution worded \"condemn,\" still universally called the censure."
              suggested_fix: "https://www.senate.gov/about/powers-procedures/censure/133Joseph_McCarthy.htm"

categories:
  - category: 1
    name: "Economic outcomes"
    category_notes: "Generally stable prosperity. Three mild recessions (1953-54, 1957-58, 1960-61). Balanced 3 of 8 budgets. Continued postwar boom and suburban expansion."
    sub_criteria:
      - id: "1.1"
        name: "Growth & employment"
        good_score: 6
        harm_score: 3
        low_confidence: false
        notes: "Real GDP grew ~2.5%/year average. Three recessions but no major downturn. Unemployment averaged ~5%."
        evidence:
          - citation: "BLS and BEA historical data 1953-1961; NBER recession dating"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "Eight-year unemployment average ~5%; three recessions (1953-54, 1957-58, 1960-61) but cumulative real GDP growth ~22% across the term."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "BLS/NBER/BEA data confirm all specifics: ~4.9% 8-yr unemployment avg, NBER-dated recessions of 1953-54, 1957-58, 1960-61, and ~2.99% annualized real GDP growth implying ~21-24% cumulative term growth (~22% is accurate)."
              suggested_fix: "For a deep BLS link to the unemployment series, cite https://data.bls.gov/timeseries/LNU04000000 (annual averages 1953-1961); GDP levels: FRED GDPCA https://fred.stlouisfed.org/series/GDPCA"
      - id: "1.2"
        name: "Inequality & mobility"
        good_score: 7
        harm_score: 2
        low_confidence: false
        notes: "Continued Great Compression. Top marginal rate held at 91%. Mass suburbanization enabled middle-class formation."
        evidence:
          - citation: "Piketty & Saez income share data 1953-1961; IRS Statistics of Income"
            source_url: "canonical"
            source_type: statistic
            tier: 1
            claim: "Top-decile income share remained at ~33% during the Eisenhower years, near the Great Compression nadir."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Piketty-Saez (\"Striking It Richer\") state the top decile share fell to just above 32.5% in WWII and \"stayed fairly stable around 33 percent until the 1970s,\" squarely covering Eisenhower's 1953-1961 plateau near the Great Compression nadir."
              suggested_fix: "https://eml.berkeley.edu/~saez/saez-UStopincomes-2022.pdf"
      - id: "1.3"
        name: "Fiscal trajectory"
        good_score: 8
        harm_score: 2
        low_confidence: false
        notes: "Balanced budgets in FY1956, 1957, 1960. Debt-to-GDP fell from ~70% to ~55%. Among the strongest fiscal records of the modern era."
        evidence:
          - citation: "OMB Historical Tables; Treasury debt data 1953-1961"
            source_url: "https://www.whitehouse.gov/omb/historical-tables/"
            source_type: statistic
            tier: 1
            claim: "Eisenhower achieved balanced budgets in three of eight fiscal years and reduced debt-to-GDP ratio by ~15 percentage points."
            direction: good
            verification_status: verified
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "OMB/American Presidency Project data confirm surpluses in FY1956, 1957, 1960 (three of eight years), and gross debt-to-GDP fell ~70%→54% (~15.8 pts), matching the ~15-point claim."
              suggested_fix: "Use deep links: OMB Hist. Table 1.1 (surpluses/deficits) and Table 7.1 (debt as % GDP) at https://www.whitehouse.gov/omb/budget/historical-tables/ ; e.g. https://obamawhitehouse.archives.gov/omb/budget/Historicals/"
      - id: "1.4"
        name: "Worker conditions & wages"
        good_score: 7
        harm_score: 2
        low_confidence: false
        notes: "Peak union density (~33%). Real wages grew steadily. Labor-Management Reporting and Disclosure Act (1959) added some union accountability."
        evidence:
          - citation: "BLS union membership data 1953-1961; Labor-Management Reporting and Disclosure Act, Public Law 86-257"
            source_url: "https://www.bls.gov/"
            source_type: statistic
            tier: 1
            claim: "US union density peaked at ~33% during Eisenhower years; real median wages grew ~25% across the term."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: medium
              checked_by: agent
              checked_at: 2026-06-28
              note: "US union density did peak at 33.5% in 1954 (all-time high, within Eisenhower's term); Census P-60 constant-dollar data shows real median family income rose ~$4,600 (1953) to $5,759 (1960), about +25%, though the claim says \"wages\" where the matching data is family income."
              suggested_fix: "For union density use https://www.bls.gov/news.release/union2.htm (and Census P-60 No. 41, https://www2.census.gov/library/publications/1963/demographics/p60-41.pdf, for the constant-dollar median family income series); note \"wages\" should read \"median family income.\""

  - category: 2
    name: "Foreign policy & war"
    category_notes: "Era E2.3 Cold War mid. Notable for restraint: Korean armistice, refusal to intervene at Dien Bien Phu, refusal to back UK/France/Israel at Suez. CIA covert operations (Iran 1953, Guatemala 1954) are the principal harm — major long-tail consequences."
    sub_criteria:
      - id: "2.1"
        name: "War & peace decisions"
        good_score: 8
        harm_score: 3
        low_confidence: false
        era_context: "E2.3 Cold War"
        notes: "Korean War armistice (July 1953). Refused to intervene at Dien Bien Phu (1954). Restraint at Suez (1956). U-2 incident handling (1960) poor. Lebanon intervention 1958 limited."
        evidence:
          - citation: "Korean War armistice, July 27, 1953; declassified NSC discussions on Dien Bien Phu intervention (1954)"
            source_url: "canonical"
            source_type: primary_document
            tier: 1
            claim: "Eisenhower ended the Korean War and declined to commit US forces to save the French in Indochina, choosing restraint where his advisors and Vice President urged escalation."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "State Dept, Eisenhower Library, and Miller Center confirm the July 27, 1953 Korean armistice and Eisenhower's 1954 refusal to commit US forces at Dien Bien Phu despite VP Nixon and Adm. Radford urging escalation."
              suggested_fix: "https://history.state.gov/milestones/1953-1960/dien-bien-phu"
      - id: "2.2"
        name: "Alliance management"
        good_score: 7
        harm_score: 3
        low_confidence: false
        notes: "NATO consolidated. SEATO (1954), CENTO (1955) Cold War alliances built. Suez crisis briefly damaged UK/France relations but ultimately strengthened US leadership."
        evidence:
          - citation: "Eisenhower Doctrine joint resolution (1957); Southeast Asia Treaty Organization founding (1954)"
            source_url: "canonical"
            source_type: primary_document
            tier: 1
            claim: "Built alliance architecture across Asia and Middle East (SEATO, CENTO, Eisenhower Doctrine) extending Truman-era containment framework."
            direction: good
            verification_status: not_applicable
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "State Dept and Wikipedia confirm SEATO (Sept 1954), Baghdad Pact/CENTO, and the Eisenhower Doctrine (joint resolution, signed Mar 1957) as Eisenhower-era containment alliances; only nuance is the US was a CENTO backer, not formal member."
              suggested_fix: "https://history.state.gov/milestones/1953-1960/eisenhower-doctrine"
      - id: "2.3"
        name: "Diplomacy & soft power"
        good_score: 7
        harm_score: 2
        low_confidence: false
        notes: "Atoms for Peace (1953). Open Skies proposal (1955). People-to-People program. Geneva Summit (1955)."
        evidence:
          - citation: "Atoms for Peace speech to UN, December 8, 1953"
            source_url: "https://www.iaea.org/"
            source_type: primary_document
            tier: 1
            claim: "Atoms for Peace speech launched IAEA framework and reshaped global nuclear policy through civilian-use framing."
            direction: good
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Eisenhower's Dec 8, 1953 UN \"Atoms for Peace\" speech proposed an \"international atomic energy agency,\" reframed nuclear tech around civilian uses, and provided the ideological foundation for the IAEA (founded 1957); date and substance are accurate."
              suggested_fix: "https://www.iaea.org/about/history/atoms-for-peace-speech"
      - id: "2.4"
        name: "Civilian impact"
        good_score: 4
        harm_score: 6
        low_confidence: false
        era_context: "E2.3 Cold War — CIA covert operations as principal harm vector"
        notes: "Operation Ajax (Iran 1953) overthrew Mossadegh, installed Shah. Operation PBSUCCESS (Guatemala 1954) overthrew Arbenz, decades of civil war ensued. Hungarian Revolution (1956) US encouraged but didn't intervene to help."
        evidence:
          - citation: "CIA Office of the Historian declassified records on Operations Ajax (1953) and PBSUCCESS (1954); FRUS Iran 1952-1954 volume"
            source_url: "https://history.state.gov/"
            source_type: primary_document
            tier: 1
            claim: "Two declassified CIA-led coups (Iran 1953, Guatemala 1954) overthrew elected governments and installed authoritarian regimes; both led to decades of subsequent civil conflict and anti-US sentiment in target regions."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: agent
              checked_at: 2026-06-28
              note: "Declassified CIA/FRUS records confirm both Eisenhower-era coups (Iran 1953/Ajax, Guatemala 1954/PBSUCCESS) overthrew elected leaders, installed authoritarian regimes, and fueled lasting anti-US sentiment; \"civil conflict\" fits Guatemala's 1960-1996 war squarely but is looser for Iran (Shah autocracy/1979 revolution rather than civil war)."
              suggested_fix: "https://history.state.gov/historicaldocuments/frus1952-54Iran"


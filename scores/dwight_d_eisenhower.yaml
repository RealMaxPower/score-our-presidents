        name: "Search, seizure, and surveillance"
        good_score: 2
        harm_score: 7
        low_confidence: false
        notes: "COINTELPRO authorized (1956) — FBI political surveillance program targeting CPUSA, then expanded over decades. CIA covert operations expanded. NSA established (1952, Truman) but expanded under Eisenhower."
        evidence:
          - citation: "FBI COINTELPRO initiation, August 28, 1956 internal memo (declassified via Church Committee, https://www.intelligence.senate.gov/sites/default/files/94755_II.pdf)"
            source_url: "https://vault.fbi.gov/"
            source_type: primary_document
            tier: 1
            claim: "Hoover initiated COINTELPRO in August 1956 as a covert FBI program (presidential or Cabinet awareness of it specifically is not documented); program ultimately targeted civil rights, anti-war, and various political movements for 15+ years."
            direction: harm
            verification_status: shallow
            fact_check:
              status: supported
              confidence: high
              checked_by: human
              checked_at: 2026-06-28
              note: "Softened the unsupported \"with Eisenhower administration awareness\" to note that COINTELPRO was a covert FBI program whose presidential/Cabinet awareness is not documented, and added the Church Committee deep-link URL to the citation."
